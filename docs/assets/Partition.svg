<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-labelledby="title description">
<title id="title">BufferQueue partitions and consumer groups</title>
<desc id="description">A producer routes writes to two partitions. Group 1 assigns one partition to each consumer; Group 2 assigns both partitions to Consumer 3.</desc>
<!-- P -> Q -> P0/P1; P0 -> C1/C3; P1 -> C2/C3. All assignments terminate on consumer nodes. -->
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#475467"/></marker>
  <marker id="assignment-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#75529b"/></marker>
</defs>
<style>
  text { font-family:Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size:20px; text-anchor:middle; dominant-baseline:middle; fill:#303b44; }
  .node { stroke-width:1.5; }
  .gateway { fill:#eaf2ff; stroke:#3567a7; }
  .core { fill:#edf1f5; stroke:#596773; }
  .storage { fill:#fff4d6; stroke:#8a6a1d; }
  .client { fill:#e9f6f1; stroke:#2f6f5e; }
  .group { fill:white; stroke:#98a2b3; stroke-width:1.5; stroke-dasharray:6 5; }
  .group-label { font-size:18px; font-weight:700; text-anchor:start; }
  .flow { fill:none; stroke:#475467; stroke-width:1.7; marker-end:url(#arrow); stroke-linejoin:round; }
  .assignment { fill:none; stroke:#75529b; stroke-width:1.7; stroke-dasharray:6 5; marker-end:url(#assignment-arrow); stroke-linejoin:round; }
</style>
<rect width="1240" height="540" fill="white"/>
<rect x="460" y="100" width="260" height="350" rx="6" fill="white" stroke="#98a2b3" stroke-width="1.5"/>
<text class="group-label" x="480" y="130">Partitions</text>
<rect class="group" x="1000" y="100" width="210" height="350" rx="6"/>
<text class="group-label" x="1020" y="130">Consumer Group 1</text>
<rect class="group" x="755" y="230" width="220" height="118" rx="6"/>
<text class="group-label" x="775" y="255">Consumer Group 2</text>
<path class="flow" d="M170 270 H215"/>
<path class="flow" d="M415 255 H445 V190 H485"/>
<path class="flow" d="M415 285 H435 V360 H485"/>
<path class="assignment" d="M695 190 H1020"/>
<path class="assignment" d="M695 360 H1020"/>
<path class="assignment" d="M695 190 H735 V292 H780"/>
<path class="assignment" d="M695 360 H735 V316 H780"/>
<rect id="P" class="node client" x="30" y="240" width="140" height="60" rx="6"/>
<text x="100" y="270" style="fill:#173f35">Producer</text>
<rect id="Q" class="node gateway" x="215" y="240" width="200" height="60" rx="6"/>
<text x="315" y="270" style="fill:#1d3b66">BufferQueue / Topic</text>
<rect id="P0" class="node storage" x="485" y="160" width="210" height="60" rx="6"/>
<text x="590" y="190" style="fill:#4d3b0e">Partition 0</text>
<rect id="P1" class="node storage" x="485" y="330" width="210" height="60" rx="6"/>
<text x="590" y="360" style="fill:#4d3b0e">Partition 1</text>
<rect id="C1" class="node client" x="1020" y="160" width="170" height="60" rx="6"/>
<text x="1105" y="190" style="fill:#173f35">Consumer 1</text>
<rect id="C2" class="node client" x="1020" y="330" width="170" height="60" rx="6"/>
<text x="1105" y="360" style="fill:#173f35">Consumer 2</text>
<rect id="C3" class="node client" x="780" y="280" width="170" height="48" rx="6"/>
<text x="865" y="304" style="fill:#173f35">Consumer 3</text>
</svg>
