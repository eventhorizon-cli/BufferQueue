<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title description">
<title id="title">BufferQueue 主题结构图</title>
<desc id="description">BufferQueue 包含多个主题，主题可包含多种数据类型。</desc>
<!-- Topology: Q -> T1, T2, More; T1 -> Span, Metric, Log. -->
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#475467"/></marker>
  <marker id="assignment-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#75529b"/></marker>
</defs>
<style>
  text { font-family:'PingFang SC', Arial, 'Microsoft YaHei', sans-serif; font-size:20px; text-anchor:middle; dominant-baseline:middle; fill:#303b44; }
  .node { stroke-width:1.5; }
  .gateway { fill:#eaf2ff; stroke:#3567a7; }
  .core { fill:#edf1f5; stroke:#596773; }
  .storage { fill:#fff4d6; stroke:#8a6a1d; }
  .client { fill:#e9f6f1; stroke:#2f6f5e; }
  .group { fill:white; stroke:#98a2b3; stroke-width:1.5; stroke-dasharray:6 5; }
  .group-label { font-size:18px; font-weight:700; text-anchor:start; }
  .flow { fill:none; stroke:#475467; stroke-width:1.7; marker-end:url(#arrow); stroke-linejoin:round; }
  .assignment { fill:none; stroke:#75529b; stroke-width:1.7; stroke-dasharray:6 5; marker-end:url(#assignment-arrow); stroke-linejoin:round; }
</style>
<rect width="1000" height="370" fill="white"/>
<path class="flow" d="M260 185 C325 185 335 70 400 70"/>
<path class="flow" d="M260 185 H400"/>
<path class="flow" d="M260 185 C325 185 335 300 400 300"/>
<path class="flow" d="M580 70 C650 70 690 50 760 50"/>
<path class="flow" d="M580 70 C650 70 690 130 760 130"/>
<path class="flow" d="M580 70 C650 70 690 210 760 210"/>
<rect id="Q" class="node gateway" x="50" y="155" width="210" height="60" rx="6"/>
<text x="155" y="185" style="fill:#1d3b66">BufferQueue</text>
<rect id="T1" class="node core" x="400" y="40" width="180" height="60" rx="6"/>
<text x="490" y="70" style="fill:#303b44">主题1</text>
<rect id="T2" class="node core" x="400" y="155" width="180" height="60" rx="6"/>
<text x="490" y="185" style="fill:#303b44">主题2</text>
<rect id="More" class="node core" x="400" y="270" width="180" height="60" rx="6"/>
<text x="490" y="300" style="fill:#303b44">…</text>
<rect id="Span" class="node storage" x="760" y="20" width="170" height="60" rx="6"/>
<text x="845" y="50" style="fill:#4d3b0e">Span</text>
<rect id="Metric" class="node storage" x="760" y="100" width="170" height="60" rx="6"/>
<text x="845" y="130" style="fill:#4d3b0e">指标</text>
<rect id="Log" class="node storage" x="760" y="180" width="170" height="60" rx="6"/>
<text x="845" y="210" style="fill:#4d3b0e">日志</text>
</svg>
