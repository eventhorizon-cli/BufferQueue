name: Publish NuGet Packages

on:
  push:
    tags:
      - "v*"
      - "core-v*"
      - "mmf-v*"

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  CORE_PROJECT: src/BufferQueue/BufferQueue.csproj
  MMF_PROJECT: src/BufferQueue.MemoryMappedFile/BufferQueue.MemoryMappedFile.csproj
  PACKAGE_AUTHORS: Event Horizon
  REPOSITORY_URL: https://github.com/eventhorizon-cli/BufferQueue
  REPOSITORY_TYPE: git
  PACKAGE_LICENSE_URL: https://raw.githubusercontent.com/eventhorizon-cli/BufferQueue/main/LICENSE

jobs:
  publish:
    name: Test, pack, and publish NuGet packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate main-only release tag and resolve versions
        id: release
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/prepare-release.sh

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('BufferQueue.slnx', '**/*.csproj', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: >-
          dotnet restore BufferQueue.slnx
          -p:CustomAfterMicrosoftCommonProps="$RELEASE_PROPS"

      - name: Build
        run: >-
          dotnet build BufferQueue.slnx
          --configuration Release
          --no-restore
          -p:CustomAfterMicrosoftCommonProps="$RELEASE_PROPS"
          -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >-
          dotnet test BufferQueue.slnx
          --configuration Release
          --no-build
          --no-restore
          -p:CustomAfterMicrosoftCommonProps="$RELEASE_PROPS"

      - name: Pack BufferQueue
        if: steps.release.outputs.target != 'mmf'
        run: >-
          dotnet pack "$CORE_PROJECT"
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          -p:CustomAfterMicrosoftCommonProps="$RELEASE_PROPS"
          -p:Authors="$PACKAGE_AUTHORS"
          -p:RepositoryUrl="$REPOSITORY_URL"
          -p:RepositoryType="$REPOSITORY_TYPE"
          -p:PackageLicenseUrl="$PACKAGE_LICENSE_URL"
          -p:ContinuousIntegrationBuild=true

      - name: Pack BufferQueue.MemoryMappedFile
        if: steps.release.outputs.target != 'core'
        run: >-
          dotnet pack "$MMF_PROJECT"
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          -p:CustomAfterMicrosoftCommonProps="$RELEASE_PROPS"
          -p:Authors="$PACKAGE_AUTHORS"
          -p:RepositoryUrl="$REPOSITORY_URL"
          -p:RepositoryType="$REPOSITORY_TYPE"
          -p:PackageLicenseUrl="$PACKAGE_LICENSE_URL"
          -p:ContinuousIntegrationBuild=true

      - name: Verify selected package files and dependency versions
        shell: python
        env:
          RELEASE_TARGET: ${{ steps.release.outputs.target }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CORE_VERSION: ${{ steps.release.outputs.core_version }}
        run: |
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          import zipfile

          target = os.environ["RELEASE_TARGET"]
          version = os.environ["RELEASE_VERSION"]
          packages = []
          if target != "mmf":
              packages.append("BufferQueue")
          if target != "core":
              packages.append("BufferQueue.MemoryMappedFile")
          directory = pathlib.Path("artifacts/packages")
          expected = {f"{package}.{version}.nupkg" for package in packages}
          actual = {path.name for path in directory.glob("*.nupkg")}
          if actual != expected:
              raise SystemExit(f"Unexpected package selection: expected {expected}, found {actual}")
          for package in packages:
              with zipfile.ZipFile(directory / f"{package}.{version}.nupkg") as archive:
                  nuspecs = [name for name in archive.namelist() if name.endswith(".nuspec")]
                  if len(nuspecs) != 1:
                      raise SystemExit(f"Expected one nuspec in {package}")
                  metadata = ET.fromstring(archive.read(nuspecs[0]))
                  text = lambda name: metadata.find(f".//{{*}}{name}").text
                  if text("id") != package or text("version") != version:
                      raise SystemExit(f"Unexpected identity or version in {package}")
                  for framework in ("net8.0", "net10.0"):
                      archive.getinfo(f"lib/{framework}/{package}.dll")
                  archive.getinfo("README.md")
                  if package == "BufferQueue.MemoryMappedFile":
                      dependencies = [item for item in metadata.findall(".//{*}dependency")
                                      if item.get("id") == "BufferQueue"]
                      if len(dependencies) != 2 or any(
                          item.get("version") != os.environ["CORE_VERSION"] for item in dependencies
                      ):
                          raise SystemExit("MMF must depend on the resolved core version for both frameworks")

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: bufferqueue-nuget-${{ steps.release.outputs.target }}-${{ steps.release.outputs.version }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      - name: Publish BufferQueue
        if: steps.release.outputs.target != 'mmf'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          package="artifacts/packages/BufferQueue.$VERSION.nupkg"

          if [[ ! -f "$package" ]]; then
            echo "::error title=Missing BufferQueue package::Expected '$package'."
            exit 1
          fi

          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE"

      - name: Publish BufferQueue.MemoryMappedFile
        if: steps.release.outputs.target != 'core'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          package="artifacts/packages/BufferQueue.MemoryMappedFile.$VERSION.nupkg"

          if [[ ! -f "$package" ]]; then
            echo "::error title=Missing BufferQueue.MemoryMappedFile package::Expected '$package'."
            exit 1
          fi

          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE"
